<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator</title>
</head>
<body>
    <canvas id="canvas192" width="192" height="192"></canvas>
    <canvas id="canvas512" width="512" height="512"></canvas>
    <script>
        function createIcon(size) {
            const canvas = document.getElementById(`canvas${size}`);
            const ctx = canvas.getContext('2d');
            
            // Gradient background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // White circle
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath();
            ctx.arc(size/2, size*0.4, size*0.15, 0, Math.PI * 2);
            ctx.fill();
            
            // Text
            ctx.fillStyle = '#667eea';
            ctx.font = `bold ${size*0.15}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('€D', size/2, size*0.4);
            
            // Emoji
            ctx.fillStyle = '#ffffff';
            ctx.font = `${size*0.12}px Arial`;
            ctx.fillText('🎰', size/2, size*0.75);
            
            return canvas.toDataURL('image/png');
        }
        
        // Generate and download
        const data192 = createIcon(192);
        const data512 = createIcon(512);
        
        console.log('Icons generated. Right-click canvases to save.');
    </script>
</body>
</html>
